# A 2D compressor cascade with prescribed flow angles

# All files relating to the case are held in a working directory
workdir: runs/compressor_cascade

inlet:
  Po: 1e5
  To: 300.
  cp: 1005.
  gamma: 1.4

mean_line:
  type: axial_compressor_rotor
  PR: 1.1
  mdot: 5.
  phi: 0.6
  psi: 0.4
  etatt: 0.9
  htr1: 0.8

# Annulus shape using meridional aspect ratios
annulus:
  AR_gap: [1.0, 1.0]  # Span to inlet/exit boundary distance
  AR_chord: 3.  # Span to chord
  nozzle_ratio: 0.9


blades:
  - DFL: 0.45  # Set number of blades using Lieblein
    Re_surf: 4e5
    sections:  # One blade section at midheight
      - spf: 0.5
        q_thick: [0.05, 0.12, 0.3, 0.02, 0.02, 0.18]
        qstar_camber: [3., 8., 1.0, 1.0, 0.0]

# Computational mesh generation
mesh:
  type: h  # Mesh topology
  dm_LE: 0.001
  ni_TE: 9
  dm_TE: 0.05
  yplus: 30.0  # Non-dimensional wall distance
  resolution_factor: 0.5  # Double grid spacing in each direction

# CFD solver
solver:
  type: embsolve
  # i_loss: 0
  n_step: 2000
  n_step_avg: 200
  plot_conv: true
  nstep_damp: -1

#operating_point:
 # mdot_pid: [0.3, 0.05, 0.0] #[0.5, 0.1, 0.0]

post_process:
  plot_pressure_distributions:
    row_spf: [[0.5,],]
  contour:
    coord: spf
    value: .5
    variable: Cp
    irow_ref: 0
    N_passage: 2

#     rtol_mdot: 0.1


post_process:
  plot_convergence:
  contour:
    coord: spf
    value: .51
    variable: Cp
    N_passage: 2
  plot_pressure_distributions:
    row_spf: [[0.5,],]
    write_raw: true
    lim: [-2.5, 0.]

# A 2D turbine cascade with prescribed flow angles

# All files relating to the case are held in a working directory
workdir: runs/turbine_cascade_ts3

inlet:
  Po: 1e5
  To: 300.
  cp: 1005.
  gamma: 1.4

mean_line:
  type: turbine_cascade
  span: [0.01, 0.011]
  Alpha: [40., -65.0]
  Ma2: 0.6
  Yh: 0.029
  htr: 0.99

# Annulus shape using meridional aspect ratios
annulus:
  AR_gap: [0.5, 0.5]  # Span to inlet/exit boundary distance
  AR_chord: 2.0  # Span to chord

# Computational mesh generation
mesh:
  type: h  # Mesh topology
  dm_LE: 0.001
  ni_TE: 9
  dm_TE: 0.03
  yplus: 30.0  # Non-dimensional wall distance
  slip_annulus: true

# Blade shapes
blades:
  # List of rows
  - Co: 0.7  # Set number of blades using circulation coeff
    Re_surf: 4e5
    sections:
      # List of sections for this row
      - spf: 0.5  # Span fraction
        # Vector of thickness parameters
        q_thick: [0.05, 0.12, 0.3, 0., 0.00, 0.18]
        # Vector of camber parameters
        qstar_camber: [10., -2., 1.0, 1.0, 0.0]
    # - ...
  # - ...


# CFD solver
solver:
  type: ts3
  nstep: 50000
  nstep_avg: 1000
  ilos: 1

post_process:
  contour:
    coord: spf
    value: 0.5
    variable: Cp
    irow_ref: 0
    N_passage: 2
    # show_mesh: true
  plot_thickness:
    row_spf: [[0.5,]]
  plot_section:
    row_spf: [[0.2,0.5,0.8],]
    coord_sys: xrt
  plot_pressure_distributions:
    row_spf: [[0.5,],]
    write_raw: true
    # compare: tests/pdist_ts3.npz

workdir: runs/axial_turbine

inlet:
  Po: 16.0e5
  To: 1600.
  cp: 1100.
  mu: # Blank to set viscosity by Re_surf
  gamma: 1.33

mean_line:
  type: axial_turbine_v2
  Alpha1: 0.
  phi2: 0.6
  mdot: 500.
  psi: 2.0
  Ma2: 0.7
  DMa3_rel: 0.1
  Ys: [0, 0]
  zeta: [1.0, 1.0]
  htr2: 0.9

annulus:
  AR_gap: [0.6, 2., 0.7]
  AR_chord: [1.6, 1.6]

blades:
  - Co: 0.7
    Re_surf: 4.0e6 # Change viscosity to match
    mstack: 0.5
    sections:
      - spf: 0.1
        q_thick: [0.05, 0.12, 0.3, 0.2, 0.04, 0.15]
        qstar_camber: [0.,0., 1.0, 1.0, 0.0]
      - spf: 0.8
        q_thick: [0.05, 0.12, 0.3, 0.2, 0.04, 0.15]
        qstar_camber: [0.,0., 1.0, 1.0, 0.0]
  - Co: 0.7
    mstack: 0.5
    sections:
      - spf: 0.5
        q_thick: [0.05, 0.12, 0.35, 0.1, 0.04, 0.15]
        qstar_camber: [0.,0., 1.0, 1.0, 0.0]
    tip: 0.01  # Rotor tip gap

# solver:
#   type: ts3
#   nstep_avg: 1000
#   nstep: 5000
#
mesh:
  type: h
  yplus: 30.
  resolution_factor: 0.5

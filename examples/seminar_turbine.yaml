workdir: runs/seminar_turbine_*

inlet:
  Po: 16.0e5
  To: 1600.
  cp: 1100.
  gamma: 1.33


Re_surf: 4e5

mean_line:
  type: axial_turbine
  Alpha1: 0.
  phi2: 0.6
  mdot: 500.
  PR_tt: 1.6
  Ma2: 0.7
  DMa3_rel: 0.0
  Ys: [0, 0]
  zeta: [1.0, 1.0]
  rrms: 1.0

# mean_line:
#   type: turbine_cascade
#   span: [0.01, 0.011]
#   Alpha: [40., -65.0]
#   Ma2: 0.6
#   Yh: 0.029
#   htr: 0.99
#
annulus:
  AR_gap: [1.6, 4.0, 2.4]
  AR_chord: [2.0, 2.0]

# annulus:
#   type: fixed_axial_chord
#   cx_gap: [0.1, 0.06, 0.1]
#   cx_row: [0.1, 0.1]
#
mesh:
  type: h
  dm_LE: 0.001
  ni_TE: 9
  dm_TE: 0.02
  yplus: 30.0
  resolution_factor: 0.5

# Blade shapes
blades:
    - spf: 0.5
      q_thick: [0.05, 0.12, 0.3, 0.2, 0.0, 0.1]
      q_camber: [0., 4., 1.0, 1.0, 0.0]
    - spf: 0.5
      q_thick: [0.05, 0.12, 0.3, 0.2, 0.0, 0.1]
      q_camber: [0., 2., 1.0, 1.0, 0.0]
      tip: 0.01

nblade:
  - Co: 0.7
  - Co: 0.7

solver:
  type: emb
  n_step: 5000
  n_step_avg: 1000
  n_step_ramp: 1000
  nstep_damp: -1

iterate:
  mean_line:
    tolerance:
      Ys: 0.01
  deviation:
  incidence:
  # diffusion_factor:
    # target:
      # 0: 0.3
  # xpeak:
    # target:
      # 0: 0.6

post_process:
  plot_convergence:
  plot_annulus:
  contour:
    coord: spf
    value: .5
    variable: Cp
    N_passage: 2
    step: 0.2
    extend: both
    lim: [-2.2, 0.2]
  plot_pressure_distributions:
    row_spf: [[0.5,],[0.5,]]

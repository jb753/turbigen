# Axial fan tutorial example

fluid:
  type: perfect  # Which fluid model, perfect or real
  cp: 1005.0     # Specific heat at constant pressure [J/kg/K]
  gamma: 1.4     # Ratio of specific heats [--]
  mu: 1.8e-5     # Dynamic viscosity [Pa*s]

mean_line:
  type: fan    # Which plugin to use, compressor/turbine etc
  DPo: 2000.0  # Stagnation pressure rise [Pa]
  mdot: 5.0    # Mass flow rate [kg/s]
  phi: 0.5     # Flow coefficient [--]
  psi: 0.4     # Loading coefficient [--]
  htr: 0.8     # Inlet hub-to-tip ratio [--]
  eta_tt: 0.9  # Efficiency guess [--]
  Po1: 1.0e5   # Inlet stagnation pressure [Pa]
  To1: 300.0   # Inlet stagnation temperature [K]

annulus:
  type: aspect_ratio  # What sets annulus shape
  AR_row: [3.0]       # Blade
  AR_gap: [1.0, 1.0]  # Gaps to inlet and exit

blades:  # List of blade row settings (only one here)
  - count:  # Use circulation coefficient to set blade count
      type: Co
      Co: 0.3
    sections:  # List of sections for this row (only one here)
      - spf: 0.5  # Span fraction of this section
        dchi_LE: 0.0  # Leading-edge recamber
        dchi_TE: 0.0  # Trailing-edge recamber
        camber:  # Define the shape of the camber line
          type: quadratic
          aft_loading: 0.0
        thickness:  # Thickness distribution of this section
          type: taylor  # Two cubic splines after Taylor
          R_LE: 0.02  # Leading-edge radius
          t_max: 0.06  # Maximum thickness
          m_tmax: 0.35  # Meridional fraction of maximum thickness
          kappa_max: 0.0  # Curvature at maximum thickness
          t_TE: 0.01  # Trailing-edge thickness
          tanwedge: 0.05  # Trailing-edge wedge angle

mesh:
  type: h
  yplus: 30.0  # Non-dimensional wall distance
  resolution_factor: 0.5  # Coarsen by factor of 2 each direction
  dm_TE: 0.0  # Settings for the cusp
  AR_cusp: 2.0
  ni_cusp: 5

# Hold design mass flow by throttling exit pressure
operating_point:
  mdot_adjust: 0.0

# Feedback loop to match the design intent
iterate:

  - type: deviation
    tolerance: 0.5  # degrees of exit flow angle

  - type: incidence
    tolerance: 0.5  # degrees of leading-edge incidence

  - type: mean_line  # Update guesses for design variables
    variables: [eta_tt]   # Which mean-line variables to feed back
    tolerance: 0.01  # as a fraction of the nominal, not an absolute

# Configure the RANS solver
solver:
  type: ember
  n_step: 1000
  n_step_avg: 250
  n_step_log: 50
  n_stage: 4
  cfl: 5.0
  sf_resid: 1.0
  dampin: 25.0
  n_levels: 3

# Apply iteration to correct incidence, loss, deviation of a turbine cascade

workdir: runs/cascade_iter

inlet:
  Po: 1e5
  To: 300.
  cp: 1005.
  mu: 1.8e-5
  gamma: 1.4

mean_line:
  type: turbine_cascade
  span: [0.1, 0.12]
  Alpha: [40., -65.]
  Ma2: 0.6
  Yh: 0.1
  htr: 0.9

annulus:
  AR_gap: [0.8, 0.9]
  AR_chord: 1.6

blades:
  - Co: 0.7
    sections:
      - spf: 0.3
        q_thick: [0.05, 0.08, 0.3, 0.02, 0.02, 0.18]
        qstar_camber: [0., 0., 1.0, 1.0, 0.0]
      - spf: 0.7
        q_thick: [0.05, 0.08, 0.3, 0.02, 0.02, 0.18]
        qstar_camber: [0., 0., 1.0, 1.0, 0.0]

iterate:
  mean_line:
    relaxation_factor: 0.5
    match_tolerance:
      Yh: 0.01
  deviation:
    clip: 5.0
    relaxation_factor: 2.0
    tolerance: 1.0
  incidence:
    clip: 2.0
    relaxation_factor: 0.2
    target: 2.0
    tolerance: 5.0

mesh:
  type: h
  yplus: 30.0

solver:
  type: ts3
  nstep: 5000
  nstep_avg: 1000
  rtol_mdot: 0.02

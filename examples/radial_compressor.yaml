# Radial compressor
#
# A radial compressor rotor with axial inflow and a radial exit, at the datum
# design of Brind (2024), J. Turbomach. 147(2). The mean line covers the rotor
# alone; the annulus outlet duct is a vaneless diffuser with a nozzle.
#
# Meshed with the OH passage mesher, with a tip gap, a thin blade with a round
# trailing edge, and the solver settings that run it through from the guess.

fluid:
  type: perfect
  cp: 1005.0
  gamma: 1.4
  mu: 1.8e-5

mean_line:
  type: radial_compressor
  # Duty
  mdot: 5.0
  Po1: 1.0e5
  To1: 300.0
  # Pressure ratio dropped with the inlet Mach number to hold the radius
  # ratio r2/r1 at the datum's 2.223
  PR_tt: 1.44186
  # Aerodynamics
  phi1: 0.6
  # Below the datum's 0.55, which choked the inducer short of the design mass
  # flow and left the leading edge near sonic at the tip
  Ma1_rel: 0.4
  htr1: 0.5
  DH: 1.0
  Alpha2_rel: -60.0
  # Guessed loss, which the mean_line iterator below replaces with what the
  # CFD actually produces
  Ys: 0.07

annulus:
  # Area through the impeller linear in mid-line radius, rather than held
  # through the inducer and taken all at once round the bend; a straight,
  # stationary diffuser hub, and the casing making the nozzle from the
  # trailing edge
  type: impeller
  AR_row: [0.3]
  # Ducts two thirds of the datum's length
  AR_gap: [0.71565, 0.3]
  nozzle_ratio: 0.9

blades:
  - count:
      type: Co
      Co: 0.7
    # Tip clearance 1% of exit span, uniform in metres along the chord
    tip: 0.01
    reference_length:
      thickness: span_in
      tip: span_out
    sections:
      - spf: 0.1
        # Leading edge a few degrees more tangential than the mean line's,
        # from the incidence a run measured. Trailing edge
        # 15 degrees less backswept, against the slip of seven blades: at +10
        # the exit flow was 6.9 degrees under-turned, and each degree more
        # recovers only about a quarter of one
        dchi_LE: -3.0
        dchi_TE: 15.0
        camber: &camber
          type: quadratic
          aft_loading: 0.0
        # Brind (2024): a 4:1 elliptic nose, constant thickness, then a
        # parabolic taper from 60% chord to 35% of the maximum at a round
        # trailing edge; maximum thickness 5% of inlet span
        thickness: &thickness
          type: impeller
          t_max: 0.05
          ellipse_ratio: 4.0
          m_taper: 0.6
          TE_ratio: 0.35
          round_TE: true
      - spf: 0.5
        dchi_LE: -3.0
        dchi_TE: 15.0
        camber: *camber
        thickness: *thickness
      - spf: 0.9
        dchi_LE: -2.0
        dchi_TE: 15.0
        camber: *camber
        thickness: *thickness

# Loss over the cut at the rotor exit, the station the deviation iterator
# measures, as well as the standard plots
post_process:
  - type: station_contour

# Throttle the outlet to the design mass flow
operating_point:
  mdot_adjust: 0.0
  throttle_Kp: 0.25
  throttle_Ki: 0.005

iterate:
  correct:
    - type: deviation
      tolerance: 0.5
    - type: mean_line
      variables: [Ys]
      clip: 0.01
      tolerance: 0.02

solver:
  type: ember
  n_step: 2000
  n_step_avg: 500
  n_step_log: 100
  cfl: 4
  n_stage: 4
  sf_resid: 1
  fac_mgrid: 0.2
  n_levels: 3
  # The change limiter clips all five conserved variables of a cell by one
  # factor, so it cannot keep a node's momentum change and cut its energy's
  dampin: 10.0
  damp_shared: true
  adaptive_smoothing: true
  # sf2 * cfl well under the 1.5 above which the smoothing amplifies
  sf2: 0.2
  sf4: 0.005
  rf_inlet: 0.1
  rf_outlet: 0.1

batch:
  bounds:
    mean_line.PR_tt: [1.5, 3.5]
    mean_line.phi1: [0.35, 1.0]
    mean_line.Ma1_rel: [0.3, 0.9]
    mean_line.htr1: [0.2, 0.8]
    mean_line.DH: [0.6, 1.4]
    mean_line.Alpha2_rel: [-80.0, -20.0]
    blades[0].count.Co: [0.4, 1.0]
mesh:
  type: ohp
  yplus: 22.5
  # Half the default cell size along the blade at the leading edge
  ds_LE: 0.005

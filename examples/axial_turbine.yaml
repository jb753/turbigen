# Axial turbine
#
# A repeating-stage axial turbine with two blade rows.

# New working directory for each invocation
work_dir: runs/*

fluid:
  type: perfect
  cp: 1100.
  gamma: 1.33
  mu: 6.0e-4

# Set viscosity by vane Reynolds number
# Re_surf: 5e5

# Design variables for an axial turbine
mean_line:
  type: axial_turbine
  n_row: 2
  # Duty
  mdot: 500.
  r_rms: 1.0
  # Aerodynamics
  psi: 1.6
  phi2: 0.6
  Ma2: 0.7
  fac_Ma3_rel: 1.0
  zeta: [1.0, 1.0]
  # Guess of loss
  Ys: [0.02, 0.05]
  Po1: 16.0e5
  To1: 1600.

# Prescribe the dimensional chords
annulus:
  type: fixed_axial_chord
  cx_gap: [0.1, 0.06, 0.2]
  cx_row: [0.1, 0.1]

# Coarse H-mesh
mesh:
  type: h
  yplus: 30.0
  # plot: true
  AR_cusp: 2.0
  ni_cusp: 5
  ni_TE: 9
  dm_TE: 0.05

# Define one mid-span section in stator and rotor
blades:
    - spf: [0.2, 0.5, 0.8]
      thick: [[0.04, 0.12, 0.35, 0.0, 0.02, 0.15],
              [0.04, 0.12, 0.35, 0.0, 0.02, 0.15],
              [0.04, 0.12, 0.35, 0.0, 0.02, 0.15]]
      camber: [[-8.0, 0., 0.0],
              [-8.0, 0., 0.0],
              [-8.0, 0., 0.0]]
    - spf: [0.2, 0.5, 0.8]
      thick: [[0.04, 0.12, 0.35, 0.0, 0.02, 0.15],
              [0.04, 0.12, 0.35, 0.0, 0.02, 0.15],
              [0.04, 0.12, 0.35, 0.0, 0.02, 0.15]]
      camber: [[6.0, 0., 0.0],
              [6.0, 0., 0.0],
              [6.0, 0., 0.0]]
      tip: 0.01

# Circulation coefficient to set blade loadings
nblade:
  - Co: 0.6
  - Co: 0.6

# Configure the RANS solver
solver:
  type: ember
  n_step: 20000
  n_step_avg: 1
  # smooth2_adapt: 0.5

# # Configure iterative updates of the geometry
fac_nstep_initial: 1.0
iterate:
  # Make the mean-line loss match CFD
  mean_line:
    tolerance:
      Ys: 0.01
  deviation:
  incidence:
    relaxation_factor: 0.02
    clip: 5.0


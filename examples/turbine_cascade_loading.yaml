# Turbine cascade, with the loading distribution shaped
#
# The same cascade as turbine_cascade.yaml, with two things changed: the camber
# line is a `bernstein` one carrying two interior coefficients, and a `loading`
# iterator moves them until the suction surface Mach distribution has its peak
# and its leading edge acceleration where they were asked for.
#
# How high the peak is cannot be left to the camber. At a fixed duty the area
# enclosed by the Mach loop is the blade circulation, which the pitch sets, so a
# camber line with pinned ends redistributes loading along the chord without
# changing how much there is -- and of the three numbers describing the shape,
# one is then spoken for. So the iterator takes the circulation coefficient as a
# third lever and the peak height as a third target, and `count: {type: Co}`
# below states where that lever starts rather than where it ends.
#
# Run it, and watch the two camber_coeff rows in the log walk their errors to
# zero:
#
#     turbigen iterate examples/turbine_cascade_loading.yaml -o runs/loading%
#
# `post.pdf` in the working directory draws the achieved distribution with the
# target dashed over it.

fluid:
  type: perfect
  cp: 1005.0
  gamma: 1.4
  mu: 1.8e-5

mean_line:
  type: turbine_cascade
  span: [0.1, 0.11]
  Alpha: [40.0, -65.0]
  Ma2: 0.6
  Ys: 0.029
  htr: 0.95
  Po1: 1.0e5
  To1: 300.0

annulus:
  type: aspect_ratio
  AR_row: [2.0]
  AR_gap: [1.0, 1.0]

blades:
  - count:
      type: Co
      Co: 0.7
    sections:
      - spf: 0.5
        dchi_LE: 10.0
        dchi_TE: -2.0
        # Both interior coefficients written out, not left to be zero-padded:
        # the iterator moves them, so each one has to be a leaf of the config.
        # All-zero is the quadratic camber line the other example uses.
        camber:
          type: bernstein
          order: 3
          coeff: [0.0, 0.0]
        thickness:
          type: taylor
          R_LE: 0.04
          t_max: 0.12
          m_tmax: 0.4
          kappa_max: 0.0
          t_TE: 0.03
          tanwedge: 0.18

mesh:
  type: h
  yplus: 30.0
  dm_TE: 0.0
  AR_cusp: 2.0
  ni_cusp: 5

iterate:
  max_iter: 15
  correct:
    - type: Re_surf
      target: 4.0e5
    - type: deviation
      tolerance: 0.5
    - type: incidence
      tolerance: 5.0
      gain: -0.1
    - type: mean_line
      variables: [Ys]
      clip: 0.01
      tolerance: 0.05
    # Where the suction peak sits, and how hard the leading edge accelerates
    # -- the latter as Ma(zeta_front)/Ma_TE * Ma_2/Ma_1, Clark's third
    # parameter, which means the same thing across rows of differing duty.
    # Two targets, because two is what a camber line has to give at a fixed
    # blade count.
    - type: loading
      i_row: 0
      zeta_front: 0.2
      zeta_peak: 0.55
      fac_front: 1.6
    - type: peak_Ma
      i_row: 0
      fac_peak: 1.3

post_process:
  - type: surface
  - type: convergence

# Recorded under `result: metrics:` in output.yaml, so a sweep of blade counts
# can be read back afterwards. The peak Mach number is what the `loading`
# iterator deliberately leaves floating, and `DF` is what it floats to.
metrics:
  - type: diffusion_factor
    spf: [0.5]

solver:
  type: ember
  n_step: 500
  n_step_avg: 250
  n_step_log: 50
  cfl: 4
  n_stage: 4
  sf_resid: 1
  fac_mgrid: 0.2
  n_levels: 3
  dampin: 25.0
  gain_filt: 1
  delta_filt: 0.1
  expon_mgrid: 2.0

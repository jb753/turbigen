# Turbine cascade, with the loading distribution shaped
#
# The same cascade as turbine_cascade.yaml, with two things changed: the camber
# line is a `bernstein` one carrying one interior coefficient, and a `loading`
# iterator moves it until the suction surface Mach distribution accelerates as
# hard as asked for by `zeta_front`.
#
# How high the peak stands cannot be left to the camber either. At a fixed duty
# the area enclosed by the Mach loop is the blade circulation, which the pitch
# sets, so a camber line with pinned ends redistributes loading along the chord
# without changing how much there is. So a second iterator, `peak_Ma`, takes
# the circulation coefficient as its own lever and the peak height as its own
# target, and `count: {type: Co}` below states where that lever starts rather
# than where it ends.
#
# Run it, and watch the camber_coeff row in the log walk its error to zero:
#
#     turbigen iterate examples/turbine_cascade_loading.yaml -o runs/loading%
#
# `post.pdf` in the working directory draws the achieved distribution with the
# target dashed over it.

fluid:
  type: perfect
  cp: 1005.0
  gamma: 1.4
  mu: 1.8e-5

mean_line:
  type: turbine_cascade
  span: [0.1, 0.11]
  Alpha: [40.0, -65.0]
  Ma2: 0.6
  Ys: 0.021986417880620935
  htr: 0.95
  Po1: 1.0e5
  To1: 300.0

annulus:
  type: aspect_ratio
  AR_row: [2.0]
  AR_gap: [1.0, 1.0]

blades:
  - count:
      type: Co
      Co: 0.7027124965034212
    sections:
      - spf: 0.5
        dchi_LE: 3.27208263288533
        dchi_TE: -2.5263871403913134
        # The interior coefficient written out, not left to be zero-padded:
        # the iterator moves it, so it has to be a leaf of the config. Zero is
        # the quadratic camber line the other example uses.
        camber:
          type: bernstein
          order: 2
          coeff: [-0.22546998925441372]
        thickness:
          type: taylor
          R_LE: 0.04
          t_max: 0.12
          m_tmax: 0.4
          kappa_max: 0.0
          t_TE: 0.03
          tanwedge: 0.18

mesh:
  type: h
  yplus: 30.0
  dm_TE: 0.0
  AR_cusp: 2.0
  ni_cusp: 5

iterate:
  max_iter: 15
  correct:
    - type: Re_surf
      target: 4.0e5
    - type: deviation
      tolerance: 0.5
    - type: incidence
      tolerance: 5.0
      gain: -0.1
    - type: mean_line
      variables: [Ys]
      clip: 0.01
      tolerance: 0.05
    # How hard the leading edge accelerates, as Ma(zeta_front)/Ma_TE *
    # Ma_2/Ma_1, Clark's third parameter, which means the same thing across
    # rows of differing duty.
    - type: loading
      i_row: 0
      zeta_front: 0.2
      fac_front: 1.6
    - type: peak_Ma
      i_row: 0
      fac_peak: 1.3
      gain: 0.75

post_process:
  - type: surface
  - type: convergence

# Recorded under `result: metrics:` in output.yaml, so a sweep of blade counts
# can be read back afterwards. The peak Mach number is what the `loading`
# iterator deliberately leaves floating, and `DF` is what it floats to.
metrics:
  - type: diffusion_factor
    spf: [0.5]

solver:
  type: ember
  n_step: 500
  n_step_avg: 250
  n_step_log: 50
  cfl: 4
  n_stage: 4
  sf_resid: 1
  fac_mgrid: 0.2
  n_levels: 3
  dampin: 25.0
  gain_filt: 1
  delta_filt: 0.1
  expon_mgrid: 2.0

# Turbine cascade

fluid:
  type: perfect
  cp: 1005.0
  gamma: 1.4
  mu: 1.8e-5

mean_line:
  type: turbine_cascade
  span: [0.1, 0.11]
  Alpha: [40.0, -65.0]
  Ma2: 0.6
  Ys: 0.029
  htr: 0.95
  Po1: 1.0e5
  To1: 300.0

annulus:
  type: aspect_ratio
  AR_row: [2.0]
  AR_gap: [1.0, 1.0]

blades:
  - count:
      type: Co
      Co: 0.7
    sections:
      - spf: 0.5
        dchi_LE: 10.0
        dchi_TE: -2.0
        camber:
          type: quadratic
          aft_loading: 0.0
        thickness:
          type: taylor
          R_LE: 0.05
          t_max: 0.12
          m_tmax: 0.3
          kappa_max: 0.0
          t_TE: 0.03
          tanwedge: 0.18

mesh:
  type: h
  yplus: 30.0
  dm_TE: 0.0
  AR_cusp: 2.0
  ni_cusp: 5

iterate:
  correct:
    - type: Re_surf
      target: 4.0e5
    - type: deviation
      tolerance: 0.5
    - type: mean_line
      variables: [Ys]
      clip: 0.01
      tolerance: 0.05

solver:
  type: ember
  n_step: 1000
  n_step_avg: 250
  n_step_log: 50
  cfl: 4
  n_stage: 4
  sf_resid: 1
  fac_mgrid: 0.2
  n_levels: 3
  dampin: 25.0
  gain_filt: 1
  delta_filt: 0.1

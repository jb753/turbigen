[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "turbigen"
version = "3.0.0"
requires-python = ">=3.12"
license = {text = "GPL-3.0-or-later"}
authors = [
  {name = "James Brind", email = "jb753@cam.ac.uk"},
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Operating System :: OS Independent"
]
dependencies = [
    'matplotlib~=3.10.0',
    "numpy~=2.5.0",
    'PyYAML~=6.0.0',
    'scipy~=1.18.0',
    # The API turbigen is built on -- a frozen Solver, a Fortran-ordered
    # Block.flat, mass_average over chosen axes -- was on ember's dev branch
    # for a while, and this was a git url pinned to it. 0.2.0 carries it, so
    # an ordinary version specifier does now.
    #
    # Compatible-release rather than a floor: ember follows semver from 0.1.0,
    # and until it reaches 1.0.0 a minor release may break the public API
    # without deprecating anything first. So 0.3.0 is a thing to adopt
    # deliberately rather than to be resolved into. ember requires numpy 2.5,
    # which is why the numpy and scipy pins above are what they are.
    #
    # ...and it is a git url again, for as long as this branch lives. The
    # RealFluid config node needs ember's real-gas equation of state, which is
    # unreleased 0.3.0, so no version specifier can reach it. This costs CI:
    # both jobs install with --only-binary ember-cfd because no runner has a
    # Fortran toolchain, and a git url is a source build, so they fail on every
    # platform until this goes back to 'ember-cfd~=0.3.0'. That swap is the
    # last step of the branch, and it waits on ember 0.3.0 shipping wheels.
    'ember-cfd @ git+https://github.com/jb753/ember.git@real-fluid',
]
description = "Framework for turbomachinery design and computational fluid dynamics simulation"
readme = "README.md"
keywords = ["turbomachinery", "computational fluid dynamics", "compressor", "turbine"]

[project.urls]
Homepage = "https://turbigen.org"
Repository = "https://gitlab.developers.cam.ac.uk/jb753/turbigen"

[project.scripts]
turbigen = "turbigen.cli:main"

[tool.black]
target-version = ["py312"]

[tool.bumpversion]
current_version = "2.7.3"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
search = "{current_version}"
replace = "{new_version}"
regex = false
ignore_missing_version = false
tag = true
sign_tags = false
tag_name = "v{new_version}"
tag_message = "Bump version: {current_version} → {new_version}"
allow_dirty = false
commit = true
message = "Bump version: {current_version} → {new_version}"
commit_args = ""
[[tool.bumpversion.files ]]
filename = "pyproject.toml"

[dependency-groups]
dev = [
    'sphinx~=8.0.0',
    'sphinx-autobuild',
    'sphinx-argparse',
    'sphinxcontrib-programoutput',
    'sphinxcontrib-bibtex',
    'setuptools<81',  # sphinxcontrib-bibtex needs pkg_resources, removed in setuptools 81+
    'snowballstemmer==2.2.0',
    'autodocsumm',
    'pytest',
    'pytest-xdist',
    'pre-commit',
    'twine',
    'bump-my-version',
    'pyqt6',
    'pdoc',
]

[tool.uv]
managed = false

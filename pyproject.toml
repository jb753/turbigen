[project]
name = "turbigen"
version = "2.0.0"
requires-python = ">=3.11"
dependencies = [
    'CoolProp~=6.7.0',
    'matplotlib~=3.10.0',
    "numpy~=2.2.4",
    'PyYAML~=6.0.0',
    'scipy~=1.15.0',
    'h5py~=3.13.0',
    'numpy-stl~=3.2.0',
    'metis~=0.2a5',
]

[project.optional-dependencies]
docs = [
    'sphinx',
    'sphinxcontrib-bibtex',
    'sphinx-autobuild',
    'sphinx-argparse',
    'sphinxcontrib-programoutput',
    'autodocsumm',
]
test = [
    'pytest',
    'pre-commit',
]
parallel = [
    'mpi4py~=3.1.6',
]

[project.scripts]
turbigen = "turbigen.main:main"
turbigen-autogrid-server = "turbigen.autogrid.server:main"

[build-system]
requires = ["meson-python", "numpy"]
build-backend = "mesonpy"

[tool.uv]
managed = false

plug_dir: plug

work_dir: test_run/*

fluid:
  type: perfect
  cp: 1005
  gamma: 1.4
  mu: 1.8e-4

mean_line:
  type: custom
  n_row: 1
  phi: 0.6
  psi: 0.6
  Ma1_rel: 0.6
  Lam: 0.5
  span: 0.1
  htr: 0.9

annulus:
  type: fixed_axial_chord
  cx_gap: [0.1, 0.3]
  cx_row: [0.1]

blades:
    - spf: 0.5
      thick: [0.015, 0.05, 0.3, 0.0, 0.0, 0.1]
      camber: [0., 0., -1.2]

nblade:
  - Co: 0.4

mesh:
  type: h
  yplus: 30.0
  # resolution_factor: 0.7
  skew_max: 45
  dm_TE: 0.1
  ni_TE: 9

operating_point:
  throttle: true
  pid: [100.0, 5000.0, 0.0]
  # PR_ts_adjust: -0.2

# Configure the RANS solver
solver:
  type: ember

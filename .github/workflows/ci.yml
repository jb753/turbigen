name: CI

on:
  push:
    branches: [master]
  pull_request:
  # Called by a release workflow, so a tag cannot publish past a red CI.
  workflow_call:
  # Manual trigger, e.g. for iterating on scratch branches that don't match
  # the push/pull_request triggers above.
  workflow_dispatch:

jobs:
  test:
    # Cross-shaped rather than the full product: every OS on one Python, and
    # every Python on one OS. A bug that is specific to both at once is rare
    # enough not to be worth quadrupling the runner minutes for, the suite
    # being several minutes of real CFD per job.
    #
    # 3.12 is the floor because scipy, numpy and ember all stop shipping
    # wheels below it; 3.14 is the ceiling ember builds for.
    strategy:
      # A Windows failure must not hide a macOS one, which is exactly what
      # this matrix exists to find.
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.13"}
          - {os: macos-latest, python: "3.13"}
          - {os: windows-latest, python: "3.13"}
          - {os: ubuntu-latest, python: "3.12"}
          - {os: ubuntu-latest, python: "3.14"}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # No compiler toolchain is installed here. ember carries the Fortran
      # solver and was once built from source as a dependency, which needed
      # gfortran and ninja and confined this job to Linux; it now ships wheels
      # for all three platforms, which is what lets this be a matrix at all.
      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install turbigen
        # --only-binary ember-cfd: no compiler is installed on any of these
        # runners, so a source build of the solver cannot succeed. Without
        # this, a gap in ember's wheel coverage -- a new interpreter it has
        # not built for yet, an unfamiliar platform -- degrades into a build
        # that fails somewhere down in gfortran. With it, the job says the
        # true thing: there is no wheel for this. Scoped to ember rather than
        # :all:, which would refuse to build turbigen itself.
        #
        # pytest-xdist because pytest.ini runs `-n auto` by default: without it
        # pytest rejects its own addopts and the job dies before collecting a
        # test. sphinx because test_config_docs.py reads field docstrings back
        # out of the source with its ModuleAnalyzer, and a module that cannot
        # be imported is a collection error, not a skip -- the check that every
        # config key is documented runs nowhere else, the docs job building the
        # page rather than testing it. Both named rather than pulled in with
        # the whole dev group, which also carries pyqt6 and needs system Qt.
        run: |
          uv venv --python ${{ matrix.python }}
          uv pip install --only-binary ember-cfd . pytest pytest-xdist sphinx

      - name: Test
        # Not --no-sync, which is for a uv-managed project: this one sets
        # tool.uv.managed = false, so there is no environment for uv to sync
        # and the flag is not accepted.
        run: uv run --no-project pytest

  docs:
    # Build the documentation, without publishing it. conf.py runs `turbigen
    # report` to render the tutorial's figures and `program-output` runs every
    # transcript the page shows, so `-W` turns a page that has drifted from the
    # code -- a moved literalinclude anchor, a command that changed its exit
    # code -- into a failure here. test_tutorial.py catches most of that on
    # every commit; this catches the sphinx-only half.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # setuptools-scm needs the tags to label the build; conf.py shows the
          # version on every page.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install turbigen and the docs toolchain
        # The sphinx pieces by name rather than the whole dev group, which also
        # carries pyqt6 and needs system Qt. --only-binary ember-cfd for the
        # reason given in `test`.
        run: |
          uv venv --python 3.13
          uv pip install --only-binary ember-cfd . \
            sphinx sphinx-argparse sphinxcontrib-programoutput \
            sphinxcontrib-bibtex 'setuptools<81' snowballstemmer==2.2.0

      - name: Build
        run: uv run --no-project sphinx-build -W doc doc/_build

      - name: Keep the built site
        uses: actions/upload-artifact@v4
        with:
          name: docs
          path: doc/_build/

  lint:
    # Once, not once per matrix leg: what black and flake8 make of the source
    # does not depend on the platform reading it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install the tools the hooks shell out to
        # `check-dead-code` runs bin/check_dead_code.sh, which calls `uv run
        # vulture`: an environment for that to find, or the hook fails to spawn
        # it and reports the spawn error as dead code. One environment, run the
        # way a developer runs it, rather than a second unpinned copy invoked
        # through uvx -- which is the arrangement pyproject.toml argues against
        # for ruff, for the same reason.
        run: |
          uv venv --python 3.13
          uv pip install vulture

      - name: Lint
        # black and flake8 at the versions the repo pins, rather than either
        # invoked loose: pre-commit is where this repo states what lint means,
        # including the exclude that keeps it off tests/ and scripts/.
        run: uvx pre-commit run --all-files --show-diff-on-failure

  package:
    needs: [test, lint, docs]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # setuptools-scm derives the version from the git tag, so the build
          # needs the full history and tags, not a shallow checkout.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build sdist and wheel
        # One wheel covers every platform, this being pure Python, so there is
        # no cibuildwheel matrix here. What is worth checking per-platform is
        # that the wheel installs and imports, which verify-install does.
        run: uv build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/*.whl
            dist/*.tar.gz

  verify-install:
    # The wheel is built once; that it works is checked everywhere, which is
    # the half of packaging a single build job cannot speak for.
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install the wheel into a clean environment
        # Explicitly bash: PowerShell is the default shell on the Windows
        # runner and does not expand the glob.
        shell: bash
        run: |
          uv venv --python 3.13 verify-venv
          VIRTUAL_ENV=verify-venv uv pip install --only-binary ember-cfd dist/*.whl

      - name: Smoke test the installed wheel
        # Driven through uv rather than by naming the interpreter, the venv
        # putting it in bin/ on one platform and Scripts/ on another.
        shell: bash
        env:
          VIRTUAL_ENV: verify-venv
        run: |
          uv run --no-project python -c "import turbigen; print(turbigen.__file__)"
          uv run --no-project turbigen --help > /dev/null

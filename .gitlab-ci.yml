image: python:3.9

# Run in two stages, only deploy if the tests pass
stages:
- test
- deploy

test:
  stage: test
  script:
  - python -V
  - apt install gfortran
  - pip install -U pip
  - pip install -e ".[test]"
  - make compile
  - pytest

docs:
  script:
  - python -V
  - pip install -U pip
  - pip install -e ".[docs]"
  - make doc

pages:
  stage: deploy
  script:
  - python -V
  - pip install -U pip
  - pip install -e ".[docs]"
  - make doc
  - mv doc/_build public
  artifacts:
        paths:
        - public
  only:
  - master


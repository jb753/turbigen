image: python:3.11

# Run in stages, only deploy if the tests pass
stages:
- test
- build
- deploy


# Setup env
before_script:
  - echo "Checking for docker socket..."
  - ls -li /var/run/docker.sock
  - curl -sSL https://get.docker.com/ | sh
  - apt update && apt install -y gfortran libopenmpi-dev fonts-freefont-ttf
  - python -V
  - python -m venv venv
  - source venv/bin/activate
  - pip install --upgrade pip
  - pip install cibuildwheel meson-python line_profiler
  - pip install .[dev,parallel]
  - mkdir -p plots

# Define a job to build the wheels
build_wheels:
  stage: build
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
    DOCKER_TLS_CERTDIR: ""
  script:
    - cibuildwheel --platform linux --output-dir dist  # Build the wheels
  artifacts:
    paths:
      - dist  # Save the dist folder with the wheels


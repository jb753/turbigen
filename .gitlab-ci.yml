image: python:3.9

test:
  script:
  - python -V
  - pip install -U pip
  - pip install -e ".[test]"
  - pytest

docs:
  script:
  - python -V
  - pip install -U pip
  - pip install -e ".[docs]"
  - make doc

pages:
  script:
  - python -V
  - pip install -U pip
  - pip install -e ".[docs]"
  - make doc
  - mv doc/_build public
  artifacts:
        paths:
        - public
  only:
  - master


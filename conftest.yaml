workdir: runs/test_*

inlet:
  Po: 1e5
  To: 300.
  cp: 1005.
  gamma: 1.4

Re_surf: 4e5

mean_line:
  type: turbine_cascade
  span: [0.01, 0.011]
  Alpha: [40., -65.0]
  Ma2: 0.6
  Yh: 0.029
  htr: 0.99

annulus:
  AR_gap: [1.0, 1.0]
  AR_chord: 2.0

mesh:
  type: h
  dm_LE: 0.001
  ni_TE: 9
  dm_TE: 0.03
  yplus: 30.0
  resolution_factor: 0.5

# Blade shapes
blades:
    - spf: 0.5
      q_thick: [0.05, 0.12, 0.3, 0., 0.00, 0.18]
      camber_type: quadratic
      q_camber: [0., 0., 0.]

nblade:
  - Co: 0.7

solver:
  type: emb
  n_step: 4000
  n_step_avg: 1000
  nstep_damp: -1

iterate:
  mean_line:
    tolerance:
      Yh: 0.01
  deviation:
  incidence:
  # diffusion_factor:
    # target:
      # 0: 0.3
  # xpeak:
    # target:
      # 0: 0.6

post_process:
  plot_convergence:
  contour:
    coord: spf
    value: .5
    variable: Cp
    N_passage: 2
    step: 0.05
    lim: [-1.6, 0.]
  plot_pressure_distributions:
    row_spf: [[0.5,],]
    target: [0.6, 0.3]
    write_raw: true
    compare: tests/back-to-back/turbine/ts3/post/pressure_distributions_raw.npz

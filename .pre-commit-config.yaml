repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-merge-conflict
    -   id: check-yaml
    -   id: check-toml
    -   id: debug-statements
-   repo: local
    hooks:
    -   id: noquit
        name: noquit
        entry: ./bin/noquit.sh
        language: script
        pass_filenames: false
    -   id: check-dead-code
        name: check dead code
        entry: ./bin/check_dead_code.sh
        language: script
        pass_filenames: false
    -   id: no-claude-in-commit-msg
        name: no Claude in commit message
        entry: ./bin/check_no_claude_commit_msg.sh
        language: script
        stages: [commit-msg]
-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.8
    hooks:
    -   id: ruff-check
        args: [--fix]
    -   id: ruff-format
exclude: '(tests|turbigen/install|configs|scripts|runs|fig)/.*'

# Input test file for config3

# Use a new workdir for each run
work_dir: runs/*

mean_line:
  type: turbine_cascade
  n_row: 1
  Ys: 0.
  Ma2: 0.6
  Alpha: [-35, 60.]
  span: [0.1, 0.11]
  htr: 0.9

annulus:
  AR_gap: [1.0, 1.0]
  AR_chord: 2.0

blades:
    - spf: 0.5
      thick: [0.05, 0.12, 0.3, 0., 0.03, 0.18]
      camber: [10., -2., 0.0]

nblade:
  - Co: 0.7

fluid:
  type: perfect
  cp: 1005
  gamma: 1.4
  mu: 1e-5

inlet:
  Po: 1e5
  To: 300.

mesh:
  type: h
  yplus: 30.
  resolution_factor: 0.5

[pytest]
testpaths = tests tests2
filterwarnings = error

# The package this one replaces lives under tests/ and is not installed: it is
# kept as a reference for the equivalence tests and for nothing else. On the
# path so `import turbigen` resolves for those tests, and not collected from,
# because it is a fixture rather than a suite.
pythonpath = tests/reference
norecursedirs = tests/reference/turbigen
